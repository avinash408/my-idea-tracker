name: Daily Bhavcopy Ingestion & App Refresh

on:
  schedule:
    # 9:00 PM IST (Mon-Fri) = 15:30 UTC
    - cron: '30 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pandas pyarrow requests beautifulsoup4

      - name: 1. Download Today's Bhavcopy from NSE
        run: |
          python src/download_daily_market_data.py --days 5

      - name: 2. Process Bhavcopy & Build Parquet Dataset
        run: |
          python src/build_stock_day_dataset.py

      - name: 3. Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync daily NSE market data [skip ci]"
          file_pattern: "data/raw/market_data/*.csv data/processed/stock_day.parquet"
          branch: main
